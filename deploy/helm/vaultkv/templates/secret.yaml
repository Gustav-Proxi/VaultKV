{{- if not .Values.api.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "vaultkv.secretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultkv.secretName" . }}
  labels: {{- include "vaultkv.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.api.token }}
  token: {{ .Values.api.token | b64enc }}
  {{- else if $existing }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
